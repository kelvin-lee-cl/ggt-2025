<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
    <title>Submit Capstone 1 — AI Writing Tutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/fa/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-root"></div>

    <div class="container mt-5 pt-5 pb-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <p class="text-muted mb-1"><span class="badge bg-primary">Capstone 1</span></p>
                <h1 class="mb-3">Submit your writing tutor link</h1>
                <p class="lead text-muted">Paste the public share URL for your configured bot or assistant (not a Google Doc or screenshot gallery).</p>

                <div class="card shadow-soft mb-4">
                    <div class="card-body">
                        <form id="capstone1LinkForm">
                            <div class="mb-4">
                                <label for="botUrl" class="form-label">Share URL of your writing tutor</label>
                                <input type="url" class="form-control" id="botUrl" name="botUrl"
                                    placeholder="https://..." required autocomplete="url" inputmode="url">
                                <div class="form-text">Must be an <code>http://</code> or <code>https://</code> link that opens your tutor for someone else.</div>
                            </div>
                            <div class="d-grid gap-2 d-md-flex">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-paper-plane me-2"></i>Submit link
                                </button>
                                <a href="capstone-1-ai-writing-tutor.html" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left me-1"></i>Back to brief
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-soft">
                    <div class="card-header">
                        <h5 class="mb-0">Your submissions for Capstone 1</h5>
                    </div>
                    <div class="card-body">
                        <div id="capstone1RecentSubmissions">
                            <p class="text-muted mb-0">No links submitted yet.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="navbar.js"></script>
    <script src="script.js"></script>
    <script src="capstone-1-submit.js"></script>
</body>

</html>
